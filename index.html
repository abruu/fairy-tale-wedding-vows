<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>%WEDDING_TITLE%</title>
    <meta name="description" content="%WEDDING_DESCRIPTION%" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- NOTE: href values must not contain %TOKENS% — Vite decodes URL
         attributes at build time and "%WE…" is not a valid escape. -->
    <link rel="canonical" href="__WEDDING_SITE_URL__" />
    <meta name="theme-color" content="%WEDDING_THEME_COLOR%" />

    <!-- Icons: the A(heart)E monogram, generated from
         /public/abrinelsa/logotab.png (see scripts/make-icons.py) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts: loaded as <link> tags (not CSS @import, which forces an extra
         blocking round-trip before the browser even discovers the font
         request) so the HTML preloader can fetch them in parallel with
         everything else. Combines the families/weights every page's
         stylesheet needs (index.css, coming-soon.css, v2.css). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500;1,600;1,700;1,900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Montserrat:wght@300;400;500;600;700&family=Josefin+Sans:wght@200;300;400;500;600&family=Jost:wght@300;400;500&family=Parisienne&display=swap"
    />

    <!-- Open Graph -->
    <meta property="og:site_name" content="%WEDDING_NAMES%" />
    <meta property="og:title" content="%WEDDING_TITLE%" />
    <meta property="og:description" content="%WEDDING_DESCRIPTION%" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%WEDDING_SITE_URL%" />
    <meta property="og:locale" content="%WEDDING_LOCALE%" />
    <meta property="og:image" content="%WEDDING_OG_IMAGE%" />
    <meta property="og:image:width" content="%WEDDING_OG_W%" />
    <meta property="og:image:height" content="%WEDDING_OG_H%" />
    <meta
      property="og:image:alt"
      content="%WEDDING_NAMES% — %WEDDING_DISPLAY_DATE%"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="%WEDDING_TWITTER_CARD%" />
    <meta name="twitter:title" content="%WEDDING_TITLE%" />
    <meta name="twitter:description" content="%WEDDING_DESCRIPTION%" />
    <meta name="twitter:image" content="%WEDDING_OG_IMAGE%" />

    <script type="application/ld+json">
      %WEDDING_JSON_LD%
    </script>
  </head>

  <body>
    <div id="root"></div>
    <!-- IMPORTANT: DO NOT REMOVE THIS SCRIPT TAG OR THIS VERY COMMENT! -->
    <script src="https://cdn.gpteng.co/gptengineer.js" type="module"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
