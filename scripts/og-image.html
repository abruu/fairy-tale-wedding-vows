<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@300;400&family=Parisienne&display=swap"
      rel="stylesheet"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        width: 1200px; height: 630px; overflow: hidden;
        display: grid; place-items: center;
        font-family: "Jost", sans-serif;
        color: #3a332c;
        background:
          radial-gradient(42% 46% at 22% 18%, rgba(240,226,205,.9) 0%, rgba(240,226,205,0) 70%),
          radial-gradient(46% 50% at 82% 84%, rgba(233,211,205,.65) 0%, rgba(233,211,205,0) 72%),
          linear-gradient(160deg, #fdfaf5 0%, #f8f1e6 45%, #f3e8d8 100%);
      }
      .frame {
        position: absolute; inset: 26px;
        border: 1px solid rgba(183,150,87,.4); border-radius: 8px;
      }
      .frame::after {
        content: ""; position: absolute; inset: 8px;
        border: 1px solid rgba(183,150,87,.18); border-radius: 4px;
      }
      .photo {
        position: absolute; inset: 0 0 0 52%;
        background: url("../public/abrinelsa/abrinelsa.jpg") center 22% / cover no-repeat;
      }
      .photo::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg,
          #f8f1e6 0%, rgba(248,241,230,.92) 18%, rgba(248,241,230,.45) 48%, rgba(248,241,230,.12) 100%);
      }
      .wrap { text-align: center; position: relative; width: 100%; padding-right: 44%; }
      .eyebrow {
        font-size: 20px; letter-spacing: .5em; text-transform: uppercase;
        color: #b79657; margin-bottom: 34px;
      }
      .eyebrow span { display: inline-block; padding: 0 22px; }
      .eyebrow i { display: inline-block; width: 70px; height: 1px; background: rgba(183,150,87,.6); vertical-align: middle; }
      .names {
        font-family: "Cormorant Garamond", serif; font-size: 104px; line-height: 1;
        letter-spacing: .01em;
      }
      .names em { color: #c07f76; font-style: normal; font-size: .5em; vertical-align: .28em; padding: 0 .18em; }
      .tag {
        font-family: "Cormorant Garamond", serif; font-style: italic;
        font-size: 26px; color: #6b6055; margin-top: 26px; letter-spacing: .04em;
      }
      .date {
        margin-top: 28px; font-size: 34px; font-weight: 300; letter-spacing: .28em;
        display: flex; align-items: center; justify-content: center; gap: 24px;
      }
      .date i { display: block; width: 64px; height: 1px; background: rgba(183,150,87,.55); }
      .soon { margin-top: 26px; font-family: "Parisienne", cursive; font-size: 26px; color: #b79657; }
    </style>
  </head>
  <body>
    <div class="photo"></div>
    <div class="frame"></div>
    <div class="wrap">
      <div class="eyebrow"><i></i><span>Save the Date</span><i></i></div>
      <div class="names">Abrin<em>♥</em>Elsa</div>
      <div class="tag">Two hearts. One story. Forever begins soon.</div>
      <div class="date"><i></i>02 · 01 · 2027<i></i></div>
      <div class="soon">Something beautiful is coming.</div>
    </div>
  </body>
</html>
