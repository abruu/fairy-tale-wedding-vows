<!doctype html>
<!-- A&A monogram → the favicon / app-icon set in /public. Render at 512×512
     (Chrome DevTools device toolbar → 512 × 512 → "Capture screenshot"), save as
     public/icon-512.png, then downscale for icon-192, apple-touch-icon (180),
     favicon-32, favicon-16 and favicon.ico (16/32/48). -->
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { width: 512px; height: 512px; overflow: hidden; background: #7B1E2B; }
      .tile {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 38%, #9A2B38 0%, #7B1E2B 55%, #5E1621 100%);
      }
      .ring { position: absolute; inset: 34px; border: 6px solid #C9A227; border-radius: 50%; }
      .ring::after { content: ""; position: absolute; inset: 10px; border: 2px solid rgba(232, 199, 90, 0.55); border-radius: 50%; }
      .mono {
        position: relative; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700;
        font-size: 210px; line-height: 1; color: #FFF8E7; letter-spacing: -6px; margin-top: -14px;
        text-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      }
      .mono em { font-style: italic; font-weight: 600; color: #E8C75A; margin: 0 -2px; font-size: 180px; }
    </style>
  </head>
  <body>
    <div class="tile"><div class="ring"></div><div class="mono">A<em>&amp;</em>A</div></div>
  </body>
</html>
