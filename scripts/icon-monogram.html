<!doctype html>
<!-- A&A monogram → the favicon / app-icon set in /public. Render at 512×512
     (Chrome DevTools device toolbar → 512 × 512 → "Capture screenshot"), save as
     public/icon-512.png, then downscale for icon-192, apple-touch-icon (180),
     favicon-32, favicon-16 and favicon.ico (16/32/48). -->
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,600&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { position: relative; width: 512px; height: 512px; overflow: hidden; background: #1E3A32; }
      .tile {
        position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 38%, #2A4D42 0%, #1E3A32 55%, #142822 100%);
      }
      .ring { position: absolute; inset: 34px; border: 4px solid #B8985A; border-radius: 50%; }
      .ring::after { content: ""; position: absolute; inset: 10px; border: 1px solid rgba(216, 192, 142, 0.55); border-radius: 50%; }
      .mono {
        position: relative; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700;
        font-size: 210px; line-height: 1; color: #FAF6EF; letter-spacing: -6px; margin-top: -14px;
        
      }
      .mono em { font-style: italic; font-weight: 600; color: #D8C08E; margin: 0 -2px; font-size: 180px; }
    </style>
  </head>
  <body>
    <div class="tile"><div class="ring"></div><div class="mono">A<em>&amp;</em>A</div></div>
  </body>
</html>
